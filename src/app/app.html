<!--
  app.html (Root Template)

  This is the simplest possible template — just one tag: <router-outlet>.

  WHAT <router-outlet> DOES:
  Angular looks at the current URL and replaces this tag with the
  right component:
    URL: /#/login        → shows LoginComponent here
    URL: /#/dashboard    → shows DashboardComponent here
    URL: /#/transactions → shows TransactionsComponent here

  That's it! All page routing happens automatically through this tag.
-->
<router-outlet />
